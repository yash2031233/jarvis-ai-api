[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-ai-api"
version = "0.1.0"
description = "Open-source voice-first desktop AI assistant with fast agentic tools and a sci-fi orb UI. Bring your own model."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "yash2031233" }]
keywords = ["jarvis", "ai-assistant", "voice-assistant", "agent", "nvidia", "llm"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "openai>=1.30",
  "httpx>=0.27",
  "keyring>=24",
  "pydantic>=2.6",
  "platformdirs>=4",
  "psutil>=5.9",
  "pywebview>=5",
  "pyperclip>=1.8",
  "rapidfuzz>=3",
  "numpy>=1.26",
  "pywebpush>=2",
]

[project.optional-dependencies]
voice = [
  "sounddevice>=0.4",
  "faster-whisper>=1.0",
  "kokoro-onnx>=0.4",
  "openwakeword>=0.6",
  "soundfile>=0.12",
]
browser = ["playwright>=1.40"]
# NVIDIA GPU speech recognition on Windows/Linux (CUDA 12 runtime libs for faster-whisper)
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
desktop = ["pynput>=1.7", "pystray>=0.19", "pillow>=10", "uiautomation>=2.0.20; sys_platform == 'win32'"]
docs = ["pypdf>=4", "python-docx>=1"]
# cameras, screen reading/recording, diagrams
vision = ["opencv-python>=4.8", "mss>=9"]
diagrams = ["matplotlib>=3.7", "sympy>=1.12"]
pocket = ["pocket-tts>=3", "torch>=2.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4", "pyinstaller>=6"]
all = ["jarvis-ai-api[voice,browser,desktop,docs,vision,diagrams]"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["ui/**/*", "router/*.json", "cad/lib/**/*", "vision/*.ps1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
