<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb Fidelity</title>
<style>
  :root { --bg:#050302; --fg:#f3d3ad; --dim:#8a6a4a; --line:#3a2616; --accent:#ffb46e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:12px 16px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; font-weight:600; margin:0 12px 0 0; letter-spacing:.08em; }
  button { background:transparent; color:var(--fg); border:1px solid var(--line); padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; }
  button.on { border-color:var(--accent); color:var(--accent); }
  #score { margin-left:auto; color:var(--accent); font-variant-numeric:tabular-nums; }
  main { padding:16px; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .cell { position:relative; aspect-ratio:1; background:#000; border:1px solid var(--line); overflow:hidden; }
  .cell img, .cell canvas { position:absolute; inset:0; width:100%; height:100%; }
  .label { position:absolute; left:8px; top:6px; font-size:12px; color:var(--dim); z-index:2; }
  #overlay { max-width:min(92vw, 92vh); margin:0 auto; }
  #slider { width:100%; margin-top:10px; accent-color:var(--accent); }
  #ab .choices { display:flex; gap:12px; justify-content:center; margin-top:12px; }
  .hidden { display:none !important; }
  @media (max-width: 700px) { .pair { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>ORB FIDELITY</h1>
  <button data-mode="side" class="on">Side by side</button>
  <button data-mode="overlay">Overlay slider</button>
  <button data-mode="diff">Difference</button>
  <button data-mode="ab">Blind A/B test</button>
  <span id="score">measuring…</span>
</header>
<main>
  <section id="side" class="pair">
    <div class="cell"><span class="label">reference</span><img id="refimg" alt="reference orb"></div>
    <div class="cell"><span class="label">render</span><canvas id="c1"></canvas></div>
  </section>

  <section id="overlay" class="hidden">
    <div class="cell" id="ovcell">
      <canvas id="c2"></canvas>
      <img id="ovref" alt="reference overlay" style="clip-path: inset(0 50% 0 0)">
    </div>
    <input id="slider" type="range" min="0" max="100" value="50" aria-label="overlay position">
  </section>

  <section id="diff" class="hidden" style="max-width:min(92vw,92vh);margin:0 auto">
    <div class="cell"><span class="label">|reference − render| (×3)</span><canvas id="cd"></canvas></div>
  </section>

  <section id="ab" class="hidden">
    <div class="pair">
      <div class="cell" id="abL"></div>
      <div class="cell" id="abR"></div>
    </div>
    <div class="choices">
      <button id="pickL">Left is the original</button>
      <button id="pickR">Right is the original</button>
      <span id="abres" style="align-self:center;color:var(--dim)"></span>
    </div>
  </section>
</main>

<script type="module">
import { Orb } from "/ui/orb3d.js";
const force2d = new URLSearchParams(location.search).has("2d");

const REF = "/compare/reference";
const N = 1920;
const ref = new Image();
ref.src = REF;
document.getElementById("refimg").src = REF;
document.getElementById("ovref").src = REF;

const orb1 = new Orb(document.getElementById("c1"), { frozen: true, pixelSize: N, noAutoResize: true, force2d });
document.querySelector("#side .cell:nth-child(2) .label").textContent = `render (${orb1.mode})`;
const orb2 = new Orb(document.getElementById("c2"), { frozen: true, pixelSize: N, noAutoResize: true, force2d });

// ---- modes
document.querySelectorAll("header button").forEach((b) => b.addEventListener("click", () => {
  document.querySelectorAll("header button").forEach((x) => x.classList.toggle("on", x === b));
  for (const id of ["side", "overlay", "diff", "ab"]) document.getElementById(id).classList.toggle("hidden", id !== b.dataset.mode);
  if (b.dataset.mode === "diff") drawDiff();
  if (b.dataset.mode === "ab") newRound();
}));
document.getElementById("slider").addEventListener("input", (e) => {
  document.getElementById("ovref").style.clipPath = `inset(0 ${100 - e.target.value}% 0 0)`;
});

// ---- metrics: compare at low resolution (structure/brightness distribution, not exact traces)
function pixels(src, size, blur) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  if (blur) g.filter = `blur(${blur}px)`;
  g.drawImage(src, 0, 0, size, size);
  return g.getImageData(0, 0, size, size).data;
}
function lum(d) { const o = new Float32Array(d.length / 4); for (let i = 0; i < o.length; i++) o[i] = 0.299*d[i*4] + 0.587*d[i*4+1] + 0.114*d[i*4+2]; return o; }
function ssim(a, b, w) {
  // mean SSIM over 8x8 windows
  const C1 = 6.5, C2 = 58.5; let sum = 0, n = 0;
  for (let y = 0; y + 8 <= w; y += 4) for (let x = 0; x + 8 <= w; x += 4) {
    let ma = 0, mb = 0;
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) { const k = (y+j)*w + x+i; ma += a[k]; mb += b[k]; }
    ma /= 64; mb /= 64;
    let va = 0, vb = 0, cv = 0;
    for (let j = 0; j < 8; j++) for (let i = 0; i < 8; i++) { const k = (y+j)*w + x+i; va += (a[k]-ma)**2; vb += (b[k]-mb)**2; cv += (a[k]-ma)*(b[k]-mb); }
    va /= 63; vb /= 63; cv /= 63;
    sum += ((2*ma*mb + C1) * (2*cv + C2)) / ((ma*ma + mb*mb + C1) * (va + vb + C2)); n++;
  }
  return sum / n;
}
function colorStats(d) { let r=0,g=0,b=0,n=0; for (let i=0;i<d.length;i+=4){ const l=d[i]+d[i+1]+d[i+2]; if(l>150){r+=d[i];g+=d[i+1];b+=d[i+2];n++;} } return n?[r/n,g/n,b/n,n/(d.length/4)]:[0,0,0,0]; }
function radial(L, w) {
  const bins = new Float32Array(24), cnt = new Float32Array(24);
  for (let y=0;y<w;y++) for (let x=0;x<w;x++){ const r=Math.hypot(x-w/2,y-w/2)/(w/2); const k=Math.min(23,Math.floor(r*24)); bins[k]+=L[y*w+x]; cnt[k]++; }
  return Array.from(bins, (v,i)=>v/cnt[i]);
}
function corr(a, b) { const n=a.length; let ma=0,mb=0; for(let i=0;i<n;i++){ma+=a[i];mb+=b[i];} ma/=n; mb/=n; let c=0,va=0,vb=0; for(let i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)**2;vb+=(b[i]-mb)**2;} return c/Math.sqrt(va*vb); }

function measure() {
  const c = document.getElementById("c1");
  const r128 = lum(pixels(ref, 128, 3)), o128 = lum(pixels(c, 128, 3));
  const r256 = lum(pixels(ref, 256, 1.5)), o256 = lum(pixels(c, 256, 1.5));
  const s = ssim(r128, o128, 128);
  const k = corr(r256, o256);
  const rad = corr(radial(r256, 256), radial(o256, 256));
  const rc = colorStats(pixels(ref, 256)), oc = colorStats(pixels(c, 256));
  const result = {
    ssim_128: +s.toFixed(4), corr_256: +k.toFixed(4), radial_profile_corr: +rad.toFixed(4),
    ref_bright_color: rc.slice(0,3).map(Math.round), render_bright_color: oc.slice(0,3).map(Math.round),
    ref_coverage: +rc[3].toFixed(4), render_coverage: +oc[3].toFixed(4),
  };
  window.__orbMetrics = result;
  document.getElementById("score").textContent =
    `SSIM ${result.ssim_128}  ·  corr ${result.corr_256}  ·  radial ${result.radial_profile_corr}  ·  coverage ${result.render_coverage}/${result.ref_coverage}`;
  return result;
}
window.measure = measure;
window.snapshot = () => new Promise((res) => document.getElementById("c1").toBlob(async (b) => {
  const r = await fetch("/compare/snapshot", { method: "POST", body: b });
  res(await r.json());
}, "image/png"));

function drawDiff() {
  const cd = document.getElementById("cd");
  const S = 960; cd.width = cd.height = S;
  const a = pixels(ref, S), b = pixels(document.getElementById("c1"), S);
  const g = cd.getContext("2d"), out = g.createImageData(S, S);
  for (let i = 0; i < a.length; i += 4) {
    out.data[i] = Math.min(255, Math.abs(a[i]-b[i]) * 3);
    out.data[i+1] = Math.min(255, Math.abs(a[i+1]-b[i+1]) * 3);
    out.data[i+2] = Math.min(255, Math.abs(a[i+2]-b[i+2]) * 3);
    out.data[i+3] = 255;
  }
  g.putImageData(out, 0, 0);
}

// ---- blind A/B
let answer = 0, rounds = 0, correct = 0;
function newRound() {
  answer = Math.random() < 0.5 ? 0 : 1;
  const L = document.getElementById("abL"), R = document.getElementById("abR");
  const img = Object.assign(document.createElement("img"), { src: REF, alt: "candidate" });
  const cv = document.createElement("img");
  cv.src = document.getElementById("c1").toDataURL("image/webp", 0.92);
  cv.alt = "candidate";
  // random crop/zoom so it's a fair look at detail too
  const zoom = 1 + Math.random() * 1.5, ox = Math.random() * 60 - 30, oy = Math.random() * 60 - 30;
  for (const el of [img, cv]) { el.style.transform = `scale(${zoom}) translate(${ox}%, ${oy}%)`; el.style.objectFit = "cover"; }
  L.replaceChildren(answer === 0 ? img : cv);
  R.replaceChildren(answer === 0 ? cv : img);
}
function pick(side) {
  rounds++; if (side === answer) correct++;
  document.getElementById("abres").textContent = `${correct}/${rounds} correct (50% = can't tell)`;
  newRound();
}
document.getElementById("pickL").onclick = () => pick(0);
document.getElementById("pickR").onclick = () => pick(1);

ref.decode().then(() => setTimeout(measure, 50));
</script>
</body>
</html>
